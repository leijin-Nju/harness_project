stages:
  - test
  - build

unit-test:
  stage: test
  image: python:3.11
  script:
    - timeout 300 pip install .[dev]
    - timeout 300 pytest -q
    - timeout 300 ruff check src tests scripts

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - timeout 600 docker build -t coding-agent-harness:ci .
