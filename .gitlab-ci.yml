stages:
  - test
  - build

unit-test:
  stage: test
  image: python:3.11
  script:
    - pip install .[dev]
    - pytest -q
    - ruff check src tests scripts

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t coding-agent-harness:ci .
